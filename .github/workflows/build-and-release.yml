name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Plugin
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Build Plugin (Release)
        run: dotnet build UoFiddler.Plugin.Granny3D\UoFiddler.Plugin.Granny3D.csproj -c Release -o build_output/plugins/

      - name: Prepare Release Package
        shell: pwsh
        run: |
          # Remove host UOFiddler libraries so they don't overwrite user's UoFiddler files
          Remove-Item -Path "build_output/plugins/Ultima.*" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "build_output/plugins/Controls.*" -Force -ErrorAction SilentlyContinue

          # Determine version name
          $ver = "latest"
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $ver = $env:GITHUB_REF -replace "refs/tags/", ""
          }
          $zipName = "UoFiddler.Plugin.Granny3D-$ver.zip"

          # Compress everything in build_output/plugins
          Compress-Archive -Path "build_output/plugins/*" -DestinationPath $zipName -Force

          echo "ZIP_PATH=$zipName" >> $env:GITHUB_ENV
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          echo "RELEASE_TAG=$ver" >> $env:GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UoFiddler.Plugin.Granny3D
          path: ${{ env.ZIP_PATH }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP_PATH }}
          name: Release ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
